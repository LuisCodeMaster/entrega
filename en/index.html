<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Entrega! — The Message Journey</title>
<meta name="description" content="You are a message traveling from one phone to another. Play with friends: chat, broken telephone and online co-op.">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="css/estilo.css?v=16">
</head>
<body>
<canvas id="c"></canvas>
<div id="ctrlOp" class="oculta">
  <button data-cmd="⬆ UP!">⬆ UP</button>
  <button data-cmd="⬇ DOWN!">⬇ DOWN</button>
  <button data-cmd="✋ WAIT!">✋ WAIT</button>
  <button data-cmd="🚀 GO!">🚀 GO</button>
  <button class="luz" data-luz="1">💡 LIGHT</button>
</div>
<div id="pad" class="oculta"></div>
<div id="aviso" class="oculta"></div>
<div id="painel"><div class="card" id="card"></div></div>
<div id="chat" class="oculta">
  <div class="chTopo"><button class="chVolta" data-c="voltar">←</button><div class="chNome"><b id="chNome">…</b><small id="chSub"></small></div><button class="chConv" data-c="convidar">🔗</button></div>
  <div id="chConvite" class="oculta"></div>
  <div id="chLista"></div>
  <div id="chMimos" class="oculta"></div>
  <div class="chBarra"><button id="btnMimo" class="chMimo" data-c="mimo" title="Gift or prank">🎁</button><input id="chTexto" maxlength="60" placeholder="Write your message…" autocomplete="off"><button data-c="enviar">➤</button></div>
  <div class="chDica">Every message is delivered by playing. Hits break letters! 🎮</div>
</div>
<div id="toast" class="oculta"></div>
<button id="btnSom">🔊</button>

<script src="js/01-base.js?v=16"></script>
<script src="js/02-fases.js?v=16"></script>
<script src="js/03-rede.js?v=16"></script>
<script src="js/04-telas.js?v=16"></script>
<script src="js/05-conversas.js?v=16"></script>
<script src="js/06-perfil.js?v=16"></script>
<script src="js/07-som.js?v=16"></script>
<script src="js/08-filtro.js?v=16"></script>
<script src="js/09-canais.js?v=16"></script>
<script src="js/10-temas.js?v=16"></script>
<script src="js/11-mural.js?v=16"></script>
<script src="js/12-telefone.js?v=16"></script>
<script src="js/12b-lobby.js?v=16"></script>
<script src="js/13-estado.js?v=16"></script>
<script src="js/14-inimigos.js?v=16"></script>
<script src="js/15-update.js?v=16"></script>
<script src="js/16-desenho.js?v=16"></script>
<script src="js/17-loop.js?v=16"></script>
</body>
</html>
