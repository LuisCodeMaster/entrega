<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Entrega! — A Jornada da Mensagem</title>
<meta name="description" content="Você é uma mensagem viajando de um celular pro outro. Jogue com um amigo online: um pilota no escuro, o outro vê o radar.">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="css/estilo.css?v=21">
</head>
<body>
<canvas id="c"></canvas>
<div id="ctrlOp" class="oculta">
  <button data-cmd="⬆ SOBE!">⬆ SOBE</button>
  <button data-cmd="⬇ DESCE!">⬇ DESCE</button>
  <button data-cmd="✋ ESPERA!">✋ ESPERA</button>
  <button data-cmd="🚀 VAI!">🚀 VAI</button>
  <button class="luz" data-luz="1">💡 LUZ</button>
</div>
<div id="pad" class="oculta"></div>
<div id="aviso" class="oculta"></div>
<div id="painel"><div class="card" id="card"></div></div>
<div id="chat" class="oculta">
  <div class="chTopo"><button class="chVolta" data-c="voltar">←</button><div class="chNome"><b id="chNome">…</b><small id="chSub"></small></div><button class="chConv" data-c="convidar">🔗</button></div>
  <div id="chConvite" class="oculta"></div>
  <div id="chLista"></div>
  <div id="chMimos" class="oculta"></div>
  <div class="chBarra"><button id="btnMimo" class="chMimo" data-c="mimo" title="Presente ou pegadinha">🎁</button><input id="chTexto" maxlength="60" placeholder="Escreva sua mensagem…" autocomplete="off"><button data-c="enviar">➤</button></div>
  <div class="chDica">Cada mensagem é entregue jogando. Dano estraga letras! 🎮</div>
</div>
<div id="toast" class="oculta"></div>
<button id="btnSom">🔊</button>
<button id="novaVersao" class="oculta"></button>
<div id="vivoBar" class="oculta"><span id="vivoTxt"></span><button id="vivoSair">✖ SAIR</button></div>

<script src="js/01-base.js?v=21"></script>
<script src="js/02-fases.js?v=21"></script>
<script src="js/03-rede.js?v=21"></script>
<script src="js/04-telas.js?v=21"></script>
<script src="js/05-conversas.js?v=21"></script>
<script src="js/06-perfil.js?v=21"></script>
<script src="js/07-som.js?v=21"></script>
<script src="js/08-filtro.js?v=21"></script>
<script src="js/09-canais.js?v=21"></script>
<script src="js/09b-sorte.js?v=21"></script>
<script src="js/10-temas.js?v=21"></script>
<script src="js/11-mural.js?v=21"></script>
<script src="js/12-telefone.js?v=21"></script>
<script src="js/12b-lobby.js?v=21"></script>
<script src="js/12c-aovivo.js?v=21"></script>
<script src="js/13-estado.js?v=21"></script>
<script src="js/14-inimigos.js?v=21"></script>
<script src="js/15-update.js?v=21"></script>
<script src="js/16-desenho.js?v=21"></script>
<script src="js/17-loop.js?v=21"></script>
</body>
</html>
