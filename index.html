<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Entrega! — A Jornada da Mensagem</title>
<meta name="description" content="Você é uma mensagem viajando de um celular pro outro. Jogue com um amigo online: um pilota no escuro, o outro vê o radar.">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#05070f;font-family:'Baloo 2',system-ui,sans-serif;color:#fff;touch-action:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh}
  #painel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,12,28,.84);backdrop-filter:blur(4px);z-index:5;padding:16px;overflow:auto;touch-action:auto}
  #painel.oculta,.oculta{display:none!important}
  .card{background:linear-gradient(160deg,#1b2550,#111733);border:2px solid #2f3d7a;border-radius:22px;padding:22px 20px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);margin:auto}
  h1{font-size:34px;line-height:1;margin-bottom:6px;color:#5cf0a8;letter-spacing:.5px}
  h2{font-size:26px;margin-bottom:6px;line-height:1.1}
  p{font-size:16px;opacity:.9;line-height:1.35;margin-bottom:12px}
  label{display:block;text-align:left;font-size:14px;opacity:.75;margin:8px 0 3px}
  input,textarea{width:100%;padding:9px 12px;border-radius:12px;border:2px solid #2f3d7a;background:#0b1020;color:#fff;font:inherit;font-size:16px;outline:none;user-select:text}
  textarea{resize:none;font-size:13px;line-height:1.3;word-break:break-all}
  input:focus,textarea:focus{border-color:#5cf0a8}
  .linha{display:flex;gap:10px}.linha>div{flex:1}
  button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:14px;background:#5cf0a8;color:#08321d;font:inherit;font-weight:800;font-size:19px;cursor:pointer;box-shadow:0 5px 0 #2a9e66}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #2a9e66}
  button.sec{background:#2f3d7a;color:#fff;box-shadow:0 5px 0 #1b2550;font-size:16px}
  button.rosa{background:#ff9ad5;color:#4a0f33;box-shadow:0 5px 0 #c25b97}
  button:disabled{opacity:.5}
  .abas{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 0 4px}
  .abas button{margin:0;padding:7px 2px;font-size:13px;background:#232b52;color:#aab;box-shadow:none;border-radius:10px;line-height:1.1}
  .abas button.on{background:#5cf0a8;color:#08321d}
  .fases{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
  .fases button{margin:0;padding:8px 0 6px;font-size:22px;line-height:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .fases button small{font-size:11px;font-weight:700}
  .fases button.bloq{background:#232b52;color:#667;box-shadow:0 5px 0 #161c3a;cursor:default}
  .fases button.sel{outline:3px solid #fff}
  .dica{font-size:13px;opacity:.65;margin-top:12px;line-height:1.4}
  .bolha{display:inline-block;background:#1f8f5f;border-radius:16px 16px 4px 16px;padding:10px 14px;margin:6px 0 10px;font-size:18px;max-width:100%;word-break:break-word;text-align:left;letter-spacing:.5px}
  .bolha.cinza{background:#33406e;border-radius:16px 16px 16px 4px}
  .checks{color:#4fc3ff;font-weight:800;margin-left:6px}
  .stats{display:flex;justify-content:space-around;margin:8px 0 4px;font-size:14px;opacity:.85}
  .stats b{display:block;font-size:22px;color:#5cf0a8}
  .grande{font-size:58px;line-height:1;margin:4px 0 6px}
  .sala{font-size:46px;font-weight:800;letter-spacing:8px;color:#ffd24d;margin:4px 0}
  .rota{display:flex;justify-content:center;gap:4px;font-size:20px;margin:6px 0 10px;flex-wrap:wrap}
  .rota span{padding:2px 6px;border-radius:8px;background:#232b52}
  .rota span.minha{background:#1f8f5f}
  .rota span.feita{opacity:.4}
  .ok{color:#5cf0a8}.ruim{color:#ff6b8a}
  .erro{color:#ff6b8a;font-size:14px;min-height:18px;margin-top:6px}
  .papeis{display:flex;gap:8px;margin-top:8px}
  .papeis button{margin:0;font-size:15px;padding:10px 4px}
  .papeis button:not(.on){background:#232b52;color:#aab;box-shadow:none}
  /* controles em jogo */
  #ctrlOp{position:fixed;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:8px;z-index:3;padding:0 8px;pointer-events:none}
  #ctrlOp button{pointer-events:auto;width:auto;flex:1;max-width:120px;margin:0;padding:10px 4px;font-size:16px;border-radius:12px;background:rgba(30,40,90,.85);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.4)}
  #ctrlOp button.luz{background:rgba(255,210,77,.9);color:#3a2a00}
  #pad{position:fixed;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(2,64px);gap:8px;z-index:3}
  #pad button{margin:0;width:64px;height:64px;border-radius:50%;font-size:0;box-shadow:0 5px 0 rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.6)}
  #aviso{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:4;background:#ff4d6d;padding:4px 12px;border-radius:10px;font-weight:700;font-size:14px}
  #chat{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;background:#0b1020 linear-gradient(160deg,#10183a,#0b1020);touch-action:auto;max-width:640px;margin:0 auto}
  .chTopo{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#1b2550;border-bottom:2px solid #2f3d7a}
  .chTopo button{margin:0;width:44px;height:44px;padding:0;font-size:22px;border-radius:12px;background:#2f3d7a;color:#fff;box-shadow:none}
  .chNome{flex:1;text-align:left;line-height:1.1}.chNome b{font-size:20px;display:block}.chNome small{font-size:13px;opacity:.7}
  #chConvite{background:#1f2a5c;padding:12px;font-size:14px;text-align:center}
  #chConvite textarea{margin-top:6px}
  #chConvite button{margin-top:8px;padding:9px;font-size:16px}
  #chLista{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
  .m{max-width:82%;padding:8px 12px;border-radius:16px;font-size:17px;line-height:1.3;word-break:break-word;user-select:text}
  .m.eu{align-self:flex-end;background:#1f8f5f;border-bottom-right-radius:4px}
  .m.ele{align-self:flex-start;background:#33406e;border-bottom-left-radius:4px}
  .m .txt{letter-spacing:.4px}
  .m .meta{font-size:12px;opacity:.75;margin-top:3px;text-align:right}
  .m .orig{font-size:13px;opacity:.85;margin-top:4px;border-top:1px solid rgba(255,255,255,.2);padding-top:4px}
  .m button{margin-top:6px;padding:6px 10px;font-size:14px;width:auto;border-radius:10px;box-shadow:0 3px 0 #2a9e66}
  .m input{margin-top:6px;font-size:15px;padding:6px 10px}
  .chData{align-self:center;font-size:12px;opacity:.55;margin:4px 0}
  .chVazio{margin:auto;text-align:center;opacity:.7;font-size:15px;padding:20px}
  .chBarra{display:flex;gap:8px;padding:10px;background:#111733;border-top:2px solid #2f3d7a}
  .chBarra input{flex:1;min-width:0}
  .chBarra .chMimo{background:#2f3d7a;color:#fff;box-shadow:0 4px 0 #1b2550}
  #chMimos{background:#1b2550;border-top:2px solid #2f3d7a;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  #chMimos .tit{grid-column:1/-1;font-size:13px;opacity:.8;text-align:center}
  #chMimos button{margin:0;padding:6px 2px;font-size:12px;line-height:1.15;border-radius:10px;background:#2f3d7a;color:#fff;box-shadow:none}
  #chMimos button b{display:block;font-size:22px}
  #chMimos button.bom{background:#1f6f4f}#chMimos button.on{outline:3px solid #ffd24d}
  .m .mimo{font-size:13px;margin-top:4px;background:rgba(0,0,0,.2);border-radius:8px;padding:3px 6px}
  .chBarra button{margin:0;width:54px;padding:0;font-size:22px;border-radius:14px}
  .chDica{font-size:12px;opacity:.55;text-align:center;padding:0 0 8px;background:#111733}
  #toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:9;background:#5cf0a8;color:#08321d;font-weight:800;padding:8px 16px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .convs{display:flex;flex-direction:column;gap:8px;margin-top:12px;text-align:left}
  .convs button{margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#232b52;color:#fff;box-shadow:0 4px 0 #161c3a;font-size:16px;text-align:left;padding:10px 12px}
  .convs button small{display:block;font-weight:500;font-size:13px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
  .badge{background:#ff4d6d;color:#fff;border-radius:10px;padding:0 8px;font-size:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ctrlOp" class="oculta">
  <button data-cmd="⬆ SOBE!">⬆ SOBE</button>
  <button data-cmd="⬇ DESCE!">⬇ DESCE</button>
  <button data-cmd="✋ ESPERA!">✋ ESPERA</button>
  <button data-cmd="🚀 VAI!">🚀 VAI</button>
  <button class="luz" data-luz="1">💡 LUZ</button>
</div>
<div id="pad" class="oculta"></div>
<div id="aviso" class="oculta"></div>
<div id="painel"><div class="card" id="card"></div></div>
<div id="chat" class="oculta">
  <div class="chTopo"><button class="chVolta" data-c="voltar">←</button><div class="chNome"><b id="chNome">…</b><small id="chSub"></small></div><button class="chConv" data-c="convidar">🔗</button></div>
  <div id="chConvite" class="oculta"></div>
  <div id="chLista"></div>
  <div id="chMimos" class="oculta"></div>
  <div class="chBarra"><button id="btnMimo" class="chMimo" data-c="mimo" title="Presente ou pegadinha">🎁</button><input id="chTexto" maxlength="60" placeholder="Escreva sua mensagem…" autocomplete="off"><button data-c="enviar">➤</button></div>
  <div class="chDica">Cada mensagem é entregue jogando. Dano estraga letras! 🎮</div>
</div>
<div id="toast" class="oculta"></div>

<script>
(()=>{
const SITE='https://luiscodemaster.github.io/entrega/';
const NO_CLAUDE=/claude\.ai|claudeusercontent|anthropic/.test(location.hostname);
const LINK=NO_CLAUDE?'https://claude.ai/artifact/YNVSU23sJdKwRsfFKtAP6f':SITE;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=800,H=450,DPR=1,SC=1,OX=0,OY=0,fixo=false;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);const iw=innerWidth,ih=innerHeight;
  cv.width=iw*DPR;cv.height=ih*DPR;
  if(fixo){W=800;H=450;SC=Math.min(iw/W,ih/H);OX=(iw-W*SC)/2;OY=(ih-H*SC)/2}
  else{W=iw;H=ih;SC=1;OX=0;OY=0}
}
addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id);
const R=()=>Math.random();
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ================= FASES =================
const FASES=[
 {nome:'Wi-Fi de Casa',ceu:['#2b1e5c','#6a3e9e'],tipos:{parede:.25,virus:.5,spam:.25},
  chefe:{nome:'Roteador Travado',emoji:'📡',hp:28,cor:'#9b6bff',fala:'Reinicia... reinicia... REINICIA!'}},
 {nome:'Torre de Celular',ceu:['#0e2a5a','#3f7fc4'],tipos:{parede:.3,virus:.35,spam:.35},
  chefe:{nome:'Torre Sobrecarregada',emoji:'🗼',hp:36,cor:'#ffd24d',fala:'Rede congestionada! ⚡'}},
 {nome:'Cabo Submarino',ceu:['#02142b','#08466b'],tipos:{parede:.2,virus:.3,spam:.15,peixe:.35},
  chefe:{nome:'Tubarão Morde-Cabo',emoji:'🦈',hp:42,cor:'#5aa9e6',fala:'Esse cabo é MEU almoço!'}},
 {nome:'Data Center',ceu:['#0c0f14','#1d2a24'],tipos:{parede:.45,virus:.35,spam:.2},
  chefe:{nome:'Firewall Supremo',emoji:'🛡️',hp:50,cor:'#ff5a3d',fala:'Pacote não autorizado!'}},
 {nome:'Celular de Destino',ceu:['#3a1a3a','#e07a5f'],tipos:{parede:.3,virus:.35,spam:.35},
  chefe:{nome:'O Hacker',emoji:'🕵️',hp:64,cor:'#2df5c0',fala:'Essa mensagem vai ser minha...'}}
];
const CORES=['#ff4d6d','#4fc3ff','#5cf0a8','#ffd24d'];
const NOMES_COR=['VERMELHO','AZUL','VERDE','AMARELO'];
const DIST=3400;
const ROTAS={ida:[0,1,2,3,4],volta:[4,3,2,1,0]};
const CORTE=3;

// ================= JORNADA =================
let J=null,modo='treino',nivelSel=0,liberado=+ls.get('entrega_lib',0);
function novaJornada(de,para,txt,rota,rodada){return {v:1,de,para,txt,rota,rodada:rodada||1,pos:0,c:[],vidas:3,sinal:100,pts:0,falhas:0}}
const SEG=(typeof Intl!=='undefined'&&Intl.Segmenter)?new Intl.Segmenter('pt'):null;
const _pc={};
function partes(t){return _pc[t]||(_pc[t]=SEG?Array.from(SEG.segment(t),x=>x.segment):Array.from(t))}
function letrasJ(){return partes(J.txt)}
const ehLetra=p=>p.trim()!=='';
function corromper(qtd){
  const L=letrasJ(),livres=[];L.forEach((p,i)=>{if(ehLetra(p)&&!J.c.includes(i))livres.push(i)});
  for(let k=0;k<qtd&&livres.length;k++){const j=Math.floor(R()*livres.length);J.c.push(livres.splice(j,1)[0])}
}
function nLetras(){return letrasJ().filter(ehLetra).length}
function perdaPorDano(){return Math.max(1,Math.round(nLetras()*0.07))}
function textoEstragado(){return letrasJ().map((p,i)=>J.c.includes(i)?'_':p).join('')}
function pctInteiro(){const n=nLetras();return n?Math.round((1-J.c.length/n)*100):100}
const CH='ENTREGA-PACOTE';
function codifica(o){
  const b=new TextEncoder().encode(JSON.stringify(o));
  for(let i=0;i<b.length;i++)b[i]^=(CH.charCodeAt(i%CH.length)+i*7)&255;
  let s='';b.forEach(x=>s+=String.fromCharCode(x));
  return 'ENT-'+btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodifica(txt){
  const m=String(txt).match(/ENT-([A-Za-z0-9_-]+)/);if(!m)return null;
  try{let b64=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b64.length%4)b64+='=';
    const s=atob(b64),b=new Uint8Array(s.length);
    for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i)^((CH.charCodeAt(i%CH.length)+i*7)&255);
    const o=JSON.parse(new TextDecoder().decode(b));if(o.v!==1||!o.txt||!ROTAS[o.rota])return null;return o;
  }catch(e){return null}
}
function normal(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function parecido(a,b){a=normal(a);b=normal(b);const m=Math.max(a.length,b.length);return m?Math.round((1-lev(a,b)/m)*100):100}

// ================= REDE (online) =================
const net={peer:null,conn:null,role:null,sala:null,ok:false,meuNome:'',outroNome:'',piloto:'host',souPiloto:false,snapT:0};
const SALA_PREFIXO='entrega-msg-sala-';
function novoCodigoSala(){const L='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=L[Math.floor(R()*L.length)];return s}
function redeDisponivel(){return typeof Peer!=='undefined'&&!NO_CLAUDE}
function fechaRede(){try{net.conn&&net.conn.close()}catch(e){}try{net.peer&&net.peer.destroy()}catch(e){}Object.assign(net,{peer:null,conn:null,role:null,sala:null,ok:false})}
function criarSala(tent=0){
  fechaRede();net.role='host';net.sala=novoCodigoSala();
  const p=new Peer(SALA_PREFIXO+net.sala);net.peer=p;
  p.on('open',()=>telaSalaCriada());
  p.on('connection',c=>{if(net.conn){c.close();return}ligaConexao(c)});
  p.on('error',e=>{if(e.type==='unavailable-id'&&tent<5)return criarSala(tent+1);erroRede(e)});
  p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});
}
function entrarSala(cod){
  fechaRede();net.role='guest';net.sala=cod;
  const p=new Peer();net.peer=p;
  p.on('open',()=>{const c=p.connect(SALA_PREFIXO+cod,{reliable:true});ligaConexao(c);
    setTimeout(()=>{if(!net.ok&&net.role==='guest'){erro('Não achei a sala '+cod+'. Confira o código e se seu amigo está com a sala aberta.')}},9000)});
  p.on('error',e=>{if(e.type==='peer-unavailable')return erro('Sala '+cod+' não encontrada. Confira o código.');erroRede(e)});
}
function ligaConexao(c){
  net.conn=c;
  c.on('open',()=>{net.ok=true;envia({t:'oi',nome:net.meuNome})});
  c.on('data',recebe);
  c.on('close',()=>{if(net.ok){net.ok=false;conexaoCaiu()}});
  c.on('error',()=>{});
}
function envia(o){try{if(net.conn&&net.conn.open)net.conn.send(o)}catch(e){}}
function erroRede(e){const msg={network:'Sem internet ou servidor de salas fora do ar.','browser-incompatible':'Este navegador não suporta o modo online.','server-error':'Servidor de salas fora do ar, tente de novo.'}[e.type]||('Erro de conexão ('+e.type+').');erro(msg)}
function conexaoCaiu(){
  if(modo==='online'){st.estado='fim';mostraCtrl()}
  painel(`<div class="grande">📵</div><h2 class="ruim">Conexão perdida</h2><p>Perdemos a ligação com ${esc(net.outroNome||'seu amigo')}.</p><button data-a="menu">MENU</button>`);
}
function recebe(m){
  if(m.t==='oi'){net.outroNome=m.nome||'Amigo';if(net.role==='host')telaLobbyHost();else telaLobbyGuest();return}
  if(m.t==='lobby'){if(net.role==='guest')telaLobbyGuest(m);return}
  if(m.t==='start'){J=m.J;comecaOnline(m.piloto);return}
  if(m.t==='s'){if(!net.souPiloto&&modo==='online')aplicaSnap(m.d);return}
  if(m.t==='ping'&&net.souPiloto&&st){st.pings.push({x:m.x,y:m.y,v:1.6});return}
  if(m.t==='cmd'&&net.souPiloto&&st){st.cmd={txt:m.txt,v:1.3};return}
  if(m.t==='luz'&&net.souPiloto&&st){st.luz=1.5;return}
  if(m.t==='fim'){J=m.J;if(!net.souPiloto){st.estado='fim';mostraCtrl();
    if(!m.ok)telaOnlinePerdeu(m.motivo);else if(J.pos>=ROTAS[J.rota].length)telaOnlineChegou();else telaOnlineFaseOk(m.chefe)}return}
  if(m.t==='palpite'){if(net.role==='host'){J.resultado={palpite:m.palpite,p:m.p};telaResultado(m.palpite,true)}return}
  if(m.t==='sala'){voltaSala();return}
}

// ================= PAINEL =================
let aba='conversas';
function painel(html){$('card').innerHTML=html;$('painel').classList.remove('oculta')}
function fechaPainel(){$('painel').classList.add('oculta');document.activeElement&&document.activeElement.blur()}
function erro(t){const e=$('erro');if(e)e.textContent=t}
function rotaHtml(online){
  const seq=ROTAS[J.rota];
  return '<div class="rota">'+seq.map((f,i)=>{
    const minha=online?false:(J.pos<CORTE)===(i<CORTE);
    return `<span class="${i<J.pos?'feita ':''}${minha?'minha':''}">${FASES[f].chefe.emoji}</span>`}).join('')+'</div>';
}
function telaInicio(){
  let corpo='';
  if(aba==='conversas')corpo=htmlConversas();
  if(aba==='online'){

    envia({t:'start',J,piloto:pilotoEscolha});comecaOnline(pilotoEscolha);
  }
  if(a==='proxOnline'){const p=net.piloto==='host'?'guest':'host';envia({t:'start',J,piloto:p});comecaOnline(p)}
  if(a==='reenviarOnline'){J.falhas++;corromper(perdaPorDano()*2);J.vidas=3;J.sinal=100;envia({t:'start',J,piloto:net.piloto});comecaOnline(net.piloto)}

  const convs=listaConvs(),hash=(location.hash.match(/^#c-([a-z0-9]{10})$/)||[])[1]||'';
  setTimeout(carregaPrevias,0);
  return `<p style="font-size:14px">Escreva uma mensagem, entregue ela <b>jogando</b> e ela aparece no celular do seu amigo, mesmo se ele estiver offline. Cada dano estraga letras!</p>
    <label>Seu nome</label><input id="meuNome" maxlength="12" value="${esc(ls.get('entrega_nome','Luis'))}">
    ${hash?`<div class="bolha cinza" style="margin-top:10px">Você recebeu um convite de conversa!</div><button data-a="entrarConv" data-n="${hash}">💬 ENTRAR NA CONVERSA</button>`:''}
    <button data-a="novaConv" ${hash?'class="sec"':''}>➕ NOVA CONVERSA</button>
    <label>…ou cole o link de convite do seu amigo</label>
    <div class="linha"><div style="flex:2"><input id="convLink" placeholder="link ou código"></div><div><button data-a="entrarConvLink" style="margin:0;height:100%">ENTRAR</button></div></div>
    <div class="erro" id="erro"></div>
    ${convs.length?'<label>Suas conversas</label><div class="convs">'+convs.map(c=>`<button data-a="abrirConv" data-n="${c.cid}"><span>💬 ${esc(c.outro||'Aguardando amigo…')}<small id="prev-${c.cid}">…</small></span><span id="bdg-${c.cid}"></span></button>`).join('')+'</div>':''}`;
}
async function carregaPrevias(){
  try{await fb.iniciar()}catch(e){return}
  for(const c of listaConvs()){
    const el=$('prev-'+c.cid);if(!el)continue;
    try{const u=await fb.api.ultima(c.cid);if(!u){el.textContent='Nenhuma mensagem ainda';continue}
      el.textContent=(u.de===fb.uid?'Você: ':'')+u.vis;
      if(u.de!==fb.uid&&(u.t||0)>(+c.visto||0)){const b=$('bdg-'+c.cid);if(b)b.innerHTML='<span class="badge">nova</span>'}
    }catch(e){el.textContent=''}
  }
}
function pegaNome(){const i=$('meuNome');const n=((i&&i.value.trim())||ls.get('entrega_nome','')||'Jogador').slice(0,12);ls.set('entrega_nome',n);return n}
function acaoConversa(a,n){
  if(a==='novaConv'){pegaNome();const cid=novoCid();salvaConv(cid,{outro:'',criei:true});abrirChat(cid,true);return true}
  if(a==='entrarConv'||a==='abrirConv'){pegaNome();abrirChat(n);return true}
  if(a==='entrarConvLink'){pegaNome();const cid=cidDe($('convLink').value.trim());if(!cid){erro('Link inválido. Cole o link inteiro que seu amigo mandou.');return true}abrirChat(cid);return true}
  if(a==='tentarChat'){iniciaEntrega(J.txt,st.mimoEnviar);return true}
  if(a==='cancelarChat'){const mi=st.mimoEnviar;mostraChat();$('chTexto').value=J?J.txt:'';mimoSel=mi;atualizaMimoBtn();return true}
  return false;
}
async function abrirChat(cid,novo){
  if(location.hash)history.replaceState(null,'',location.pathname);
  erro('Conectando…');
  try{await fb.iniciar()}catch(e){erro('Não consegui conectar ao servidor das conversas. Confira a internet e tente de novo.');return}
  ch.desliga.forEach(f=>{try{f()}catch(e){}});
  Object.assign(ch,{cid,msgs:[],ids:new Set(),outro:(listaConvs().find(c=>c.cid===cid)||{}).outro||'',membros:{},desliga:[]});
  salvaConv(cid,{});
  try{await fb.api.entrar(cid,ls.get('entrega_nome','Jogador'))}catch(e){erro('Não consegui entrar nessa conversa.');return}
  ch.desliga.push(fb.api.membros(cid,m=>{ch.membros=m;const o=Object.entries(m).find(([u])=>u!==fb.uid);
    if(o){ch.outro=o[1].nome;salvaConv(cid,{outro:ch.outro})}if(ch.aberto)topoChat()}));
  ch.desliga.push(fb.api.ouvir(cid,(id,m)=>{if(ch.ids.has(id))return;ch.ids.add(id);ch.msgs.push({id,...m});
    if(ch.aberto){renderMsgs();if(m.de!==fb.uid){marcaVisto();if(document.hidden)document.title='💬 Nova mensagem — ENTREGA!'}}}));
  mostraChat();if(novo)mostraConvite(true);
}
function mostraChat(){
  modo='chat_menu';fixo=false;resize();fechaPainel();
  ch.aberto=true;$('chat').classList.remove('oculta');topoChat();renderMsgs();marcaVisto();
  if(st)st.estado='parado';
}
function fechaChat(){ch.aberto=false;$('chat').classList.add('oculta')}
function marcaVisto(){const u=ch.msgs.filter(m=>m.de!==fb.uid).pop();if(u)salvaConv(ch.cid,{visto:u.t||Date.now()})}
function topoChat(){
  $('chNome').textContent=ch.outro||'Aguardando amigo…';
  $('chSub').textContent=ch.outro?'mensagens entregues jogando':'toque em 🔗 pra convidar';
}
function mostraConvite(forca){
  const box=$('chConvite');if(!forca&&!box.classList.contains('oculta')){box.classList.add('oculta');return}
  const link=SITE+'#c-'+ch.cid;
  const share=`💬 Bora conversar no ENTREGA! Lá cada mensagem tem que ser entregue jogando 😂\nAbre esse link e entra na nossa conversa:\n${link}`;
  box.innerHTML=`Mande esse convite pro seu amigo (só precisa uma vez):<textarea id="share" rows="3" readonly>${esc(share)}</textarea><button class="sec" data-c="copiar">📋 COPIAR CONVITE</button><div class="erro" id="erro"></div>`;
  box.classList.remove('oculta');
}
function fmtHora(t){if(!t)return'';const d=new Date(t);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function adivs(){try{return JSON.parse(ls.get('entrega_adiv','{}'))}catch(e){return{}}}
function renderMsgs(){
  const box=$('chLista');const fim=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  if(!ch.msgs.length){box.innerHTML=`<div class="chVazio">Nenhuma mensagem ainda.<br>Escreva algo aí embaixo e entregue jogando! ✉️</div>`;return}
  const ad=adivs();let html='',dia='';
  for(const m of ch.msgs){
    const d=m.t?new Date(m.t).toLocaleDateString('pt-BR'):'';if(d&&d!==dia){dia=d;html+=`<div class="chData">${d}</div>`}
    const hora=m.t?new Date(m.t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
    const selo=(m.chefe?'👑 ':'')+`✓✓ ${m.pct}%`;
    const mim=m.mimo&&MIMOS[m.mimo]?`<div class="mimo">🎁 ${m.de===fb.uid?'você mandou':'mandou junto'}: ${MIMOS[m.mimo].e} ${MIMOS[m.mimo].n}</div>`:'';
    if(m.de===fb.uid){
      html+=`<div class="m eu"><div class="txt">${esc(m.vis)}</div>${m.vis!==m.txt?`<div class="orig">você escreveu: ${esc(m.txt)}</div>`:''}${mim}<div class="meta">${hora} · ${selo}</div></div>`;
    }else{
      const g=ad[m.id];
      let extra='';
      if(m.vis!==m.txt){
        if(g)extra=`<div class="orig">você entendeu: ${esc(g.p)}<br>era: <b>${esc(m.txt)}</b> · acertou ${g.n}%</div>`;
        else if(ch.adivinhando===m.id)extra=`<input id="palpite" maxlength="80" value="${esc(m.vis.replace(/_/g,''))}"><button data-c="conferir" data-id="${m.id}">CONFERIR ✓</button>`;
        else extra=`<button data-c="adivinhar" data-id="${m.id}">🤔 Adivinhar</button>`;
      }
      html+=`<div class="m ele"><div class="txt">${esc(m.vis)}</div>${extra}${mim}<div class="meta">${esc(m.nome)} · ${hora} · ${selo}</div></div>`;
    }
  }
  box.innerHTML=html;if(fim||!box.dataset.vis){box.scrollTop=box.scrollHeight;box.dataset.vis=1}
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('oculta');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('oculta'),2600)}

    box.innerHTML='<div class="tit">Mande junto com a mensagem. Vale pra próxima entrega de '+esc(ch.outro||'seu amigo')+'!</div>'+
      Object.entries(MIMOS).map(([k,m])=>`<button data-c="escMimo" data-id="${k}" class="${k==='vida'||k==='escudo'?'bom ':''}${mimoSel===k?'on':''}"><b>${m.e}</b>${m.n}</button>`).join('')+
      `<button data-c="escMimo" data-id=""><b>✖️</b>nada</button>`;box.classList.remove('oculta');return}
  if(c==='escMimo'){mimoSel=b.dataset.id||null;atualizaMimoBtn();if(mimoSel)toast(MIMOS[mimoSel].e+' vai junto com a próxima mensagem');return}
  if(c==='convidar'){mostraConvite();return}
  if(c==='copiar'){copiar();return}

    $('chTexto').value='';iniciaEntrega(t);return}

  if(c==='conferir'){const m=ch.msgs.find(x=>x.id===b.dataset.id),p=$('palpite').value.trim();if(!m||!p)return;
    const n=parecido(p,m.txt),ad=adivs();ad[m.id]={p,n};ls.set('entrega_adiv',JSON.stringify(ad));ch.adivinhando=null;renderMsgs();
    toast(n>=95?'🏆 Entendeu tudo!':n>=75?'👍 Quase!':n>=50?'🤔 Mais ou menos':'😵 Telefone sem fio!');return}
});

$('chTexto').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.querySelector('[data-c="enviar"]').click()}});
const EFEITOS={coracao:'❤️ = +1 VIDA',fogo:'🔥 = TIRO DE FOGO',risada:'😂 = ESCUDO',kkk:'KKKK = BÔNUS DE RISADA',socorro:'SOCORRO?! UM MINI-CHEFE OUVIU…',pergunta:'❓ PERGUNTA TEM PRESSA: CAMINHO CURTO'};
function efeitosDoTexto(t){const l=t.toLowerCase(),e=[];
  if(/❤|♥|💖|💕|💗|😍|🥰/.test(t))e.push('coracao');
  if(/🔥/.test(t))e.push('fogo');
  if(/😂|🤣/.test(t))e.push('risada');
  if(/k{3,}|(ha){2,}|(rs){2,}/.test(l))e.push('kkk');
  if(/socorro|help/.test(l))e.push('socorro');
  if(/\?/.test(t))e.push('pergunta');
  return e}
const MIMOS={inv:{e:'😈',n:'controles invertidos'},neblina:{e:'🌫️',n:'neblina'},tubarao:{e:'🦈',n:'cardume de tubarões'},lento:{e:'🐌',n:'mensagem pesada'},vida:{e:'❤️',n:'vida extra'},escudo:{e:'🛡️',n:'escudo'}};
let mimoSel=null;
function mimoRecebido(){for(let i=ch.msgs.length-1;i>=0;i--){const m=ch.msgs[i];if(m.de===fb.uid)return null;if(m.mimo&&MIMOS[m.mimo])return m}return null}
function iniciaEntrega(txt,mimoEnviar=mimoSel){
  J=novaJornada(ls.get('entrega_nome','Eu'),ch.outro||'Amigo',txt,'ida');
  J.c=letrasJ().map((p,i)=>ehLetra(p)?i:-1).filter(i=>i>=0);
  const ef=efeitosDoTexto(txt),mr=mimoRecebido();
  const minhas=ch.msgs.filter(m=>m.de===fb.uid).length,chefeVez=(minhas+1)%4===0;
  const comChefe=chefeVez||ef.includes('socorro');
  let dist=(comChefe?2400:3200)+J.c.length*70;if(ef.includes('pergunta'))dist*=.75;
  const fase=ch.msgs.length%FASES.length;
  fechaChat();modo='chat';fixo=false;resize();fechaPainel();
  dados={de:J.de,para:J.para};
  novo(fase,{vidas:3+(ef.includes('coracao')?1:0)+(mr&&mr.mimo==='vida'?1:0),sinal:100,primeira:true,ultima:true,dist,semChefe:!comChefe,hpMul:chefeVez?.6:.4,
    rotulo:chefeVez?'👑 MENSAGEM IMPORTANTE':'ENTREGANDO PRA '+(ch.outro||'SEU AMIGO').toUpperCase()});
  Object.assign(st,{comChefe,efeitos:ef,mimo:mr?mr.mimo:null,mimoEnviar:mimoEnviar||null,letrasPegas:0,
    fila:J.c.map((i,k)=>({i,ch:letrasJ()[i],d:(k+1)/(J.c.length+1)*dist*0.9})),
    escudos:(ef.includes('risada')?1:0)+(mr&&mr.mimo==='escudo'?1:0),fogoSempre:ef.includes('fogo'),
    filaAvisos:['PEGUE AS LETRAS DA SUA MENSAGEM!',...(mr?[esc(mr.nome).toUpperCase()+' TE MANDOU: '+MIMOS[mr.mimo].e+' '+MIMOS[mr.mimo].n.toUpperCase()+'!']:[]),...ef.map(k=>EFEITOS[k])]});
  mimoSel=null;atualizaMimoBtn();
}
function atualizaMimoBtn(){const b=$('btnMimo');if(b)b.textContent=mimoSel?MIMOS[mimoSel].e:'🎁';const box=$('chMimos');if(box)box.classList.add('oculta')}
async function entregaConcluida(){
  const pts=Math.round(200+st.vidas*120+st.pegos*30+st.letrasPegas*15+(st.comChefe?400:0)+(st.efeitos.includes('kkk')?150:0));
  const msg={nome:J.de,txt:J.txt.slice(0,120),vis:textoEstragado().slice(0,120),pct:pctInteiro(),pts,fase:st.n,chefe:!!st.comChefe};

  catch(e){mostraChat();$('chTexto').value=J.txt;mimoSel=st.mimoEnviar;atualizaMimoBtn();toast('⚠️ Sem conexão: a mensagem não foi enviada')}
}

function apertaCor(i){
  const b=st.boss;if(!b||!b.escudo)return;
  b.apertos=(b.apertos||[]);
  if(b.codigo[b.prog]===i){b.prog++;explodir(st.x,st.y,CORES[i],8);
    if(b.prog>=b.codigo.length){b.escudo=false;b.escudoT=b.hp<b.hpMax/2?5:6.5;st.banner=1.2;st.bannerTxt='ESCUDO DESLIGADO! ATIRA!'}}
  else{b.prog=0;b.codigo=novoCodigoCor(b);st.shake=.25;st.bannerTxt='CÓDIGO ERRADO!';st.banner=1}
}
function novoCodigoCor(b){const n=b.hp<b.hpMax/2?4:3;return Array.from({length:n},()=>Math.floor(R()*4))}

function sorteia(t){let r=R(),a=0;for(const k in t){a+=t[k];if(r<a)return k}return 'virus'}
function gerarObstaculo(){
  const k=sorteia(st.f.tipos),p=st.dist/st.distMax;
  if(k==='parede'){const gap=Math.max(140,220-p*50-st.n*8)+(st.online?20:0),gy=50+R()*(H-100-gap);st.obs.push({k,x:W+40,gy,gap,w:34})}
  else if(k==='virus'){const y=60+R()*(H-120);st.obs.push({k,x:W+40,y,base:y,r:20+R()*8,fase:R()*6,amp:30+R()*50})}
  else if(k==='spam')st.obs.push({k,x:W+40,y:60+R()*(H-120),vy:(R()<.5?-1:1)*(60+R()*80),r:22});
  else if(k==='peixe')st.obs.push({k,x:W+60,y:60+R()*(H-120),r:18,vx:-80-R()*80});
}
function gerarItem(){st.itens.push({x:W+30,y:50+R()*(H-100),r:18,t:R()*6})}

function iniciaChefe(){
  const c=st.f.chefe;st.estado='chefe';st.obs=[];
  const hp=Math.round(c.hp*st.hpMul);st.boss={...c,hp,hpMax:hp,x:W+120,alvoX:W-Math.min(130,W*0.18),y:H/2,t:0,atk:1.8,flash:0,entrando:true,dash:null,falaT:3,sub:0,
           escudo:st.online,prog:0,codigo:null,escudoT:0};

}
function mirar(x,y,v){const a=Math.atan2(st.y-y,st.x-x);return[Math.cos(a)*v,Math.sin(a)*v]}
function tiro(x,y,vx,vy,o={}){const k=st.online?.85:1;st.tiros.push({x,y,vx:vx*k,vy:vy*k,r:o.r||9,cor:o.cor||'#ff4d6d',vida:o.vida||8})}
function leque(x,y,n,abert,v,cor){const a0=Math.atan2(st.y-y,st.x-x);for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*abert;tiro(x,y,Math.cos(a)*v,Math.sin(a)*v,{cor})}}
function atualizaChefe(dt){
  const b=st.boss;b.t+=dt;b.flash-=dt;b.falaT-=dt;
  if(b.entrando){b.x+=(b.alvoX-b.x)*dt*2.5;if(Math.abs(b.x-b.alvoX)<4)b.entrando=false;return}
  if(st.online&&!b.escudo){b.escudoT-=dt;if(b.escudoT<=0){b.escudo=true;b.prog=0;b.codigo=novoCodigoCor(b);st.banner=1.2;st.bannerTxt='ESCUDO VOLTOU!'}}
  const furia=b.hp<b.hpMax/2;b.atk-=dt*(furia?1.35:1)*(st.online?.85:1);const id=st.n;
  if(id===0){b.y=H/2+Math.sin(b.t*1.1)*(H*.3);
    if(b.atk<=0){leque(b.x-40,b.y,furia?7:5,.22,260,'#b48cff');b.atk=1.5;
      if(furia){b.sub++;if(b.sub%2===0)for(let i=0;i<10;i++){const a=i/10*Math.PI*2;tiro(b.x,b.y,Math.cos(a)*180,Math.sin(a)*180,{cor:'#e0ccff'})}}}}
  if(id===1){b.y=H/2+Math.sin(b.t*.8)*(H*.2);
    if(b.atk<=0){const n=furia?3:2;
      for(let i=0;i<n;i++){const x=i===0?st.x:40+R()*(W*0.65);st.avisos.push({k:'raio',x,w:46,t:st.online?1.2:.9,ativo:0})}
      tiro(b.x-30,b.y,...mirar(b.x,b.y,300),{cor:'#ffe680'});b.atk=furia?1.5:1.9}}
  if(id===2){
    if(b.dash){const d=b.dash;d.t-=dt;if(d.t<=0){b.x-=900*dt;b.y=d.y;if(b.x<-140){b.x=W+140;b.dash=null;b.voltando=true}}}
    else if(b.voltando){b.x+=(b.alvoX-b.x)*dt*3;b.y+=(H/2-b.y)*dt*2;if(Math.abs(b.x-b.alvoX)<5)b.voltando=false}
    else{b.y+=(st.y-b.y)*dt*1.2;
      if(b.atk<=0){b.sub++;
        const av=st.online?1.15:.85;
        if(b.sub%2===0||furia){b.dash={y:st.y,t:av};st.avisos.push({k:'faixa',y:st.y,h:70,t:av,ativo:0})}
        else for(let i=0;i<5;i++)tiro(b.x-40,b.y,-200-R()*120,(R()-.5)*200,{cor:'#9fe0ff',r:11});
        b.atk=furia?1.6:2.1}}}
  if(id===3){b.y=H/2+Math.sin(b.t*1.4)*(H*.28);
    if(b.atk<=0){b.sub++;
      if(b.sub%2){const gap=(furia?150:180)+(st.online?20:0),gy=40+R()*(H-80-gap);st.obs.push({k:'parede',x:b.x-60,gy,gap,w:30,vel:furia?300:240,mov:furia?(R()<.5?-70:70):0})}
      else leque(b.x-40,b.y,3,.18,330,'#ffae5c');
      b.atk=furia?0.95:1.25}}
  if(id===4){
    if(b.atk<=0){const base=b.t*2.2,k=furia?4:3;
      for(let i=0;i<k;i++){const a=base+i*Math.PI*2/k;tiro(b.x,b.y,Math.cos(a)*200,Math.sin(a)*200,{cor:'#2df5c0'})}
      b.atk=.22;b.cont=(b.cont||0)+1;
      if(b.cont%22===0){const y=60+R()*(H-120);st.obs.push({k:'virus',x:b.x-40,y,base:y,r:22,fase:0,amp:50,vel:260})}
      if(furia&&b.cont%30===0){b.alvoY=70+R()*(H-140);explodir(b.x,b.y,'#2df5c0',20)}}
    if(b.alvoY!=null)b.y+=(b.alvoY-b.y)*dt*6;else b.y=H/2+Math.sin(b.t*.9)*(H*.25)}
}

// ================= UPDATE =================
function update(dt){
  if(!st)return;
  st.t+=dt;st.banner-=dt;if(st.shake>0)st.shake-=dt;
  for(const p of st.pings)p.v-=dt;st.pings=st.pings.filter(p=>p.v>0);
  if(st.cmd){st.cmd.v-=dt;if(st.cmd.v<=0)st.cmd=null}
  if(st.meuCmd){st.meuCmd.v-=dt;if(st.meuCmd.v<=0)st.meuCmd=null}
  if(st.luz>0)st.luz-=dt;if(st.luzCd>0)st.luzCd-=dt;
  atualizaParts(dt);
  if(st.estado==='espectador'){st.scroll+=150*dt;return}
  if(st.estado==='fim'||st.estado==='parado'){st.scroll+=60*dt;return}
  const correndo=st.estado==='corrida';
  st.scroll+=st.vel*dt*(correndo?1:.45);
  if(st.online)enviaSnap(dt);
  if(st.estado==='chegando'){st.fimT+=dt;st.x+=(W*0.72-st.x)*dt*3;st.y+=(H*.5-st.y)*dt*3;if(st.fimT>1.8)faseVencida();return}
  if(st.estado==='vitoria'){st.fimT+=dt;st.x+=st.vel*dt*1.5;if(st.fimT>1.6)faseVencida();return}

  let ax=0,ay=0;
  if(keys['arrowup']||keys['w'])ay-=1;if(keys['arrowdown']||keys['s'])ay+=1;
  if(keys['arrowleft']||keys['a'])ax-=1;if(keys['arrowright']||keys['d'])ax+=1;
  const inv=st.mimo==='inv',pes=st.mimo==='lento'?.38:1;if(inv){ay=-ay;ax=-ax}
  if(toque){const tx=inv?W-(toque.x+40):toque.x+40,ty=inv?H-(toque.y-50):toque.y-50;st.vx=(tx-st.x)*9*pes;st.vy=(ty-st.y)*9*pes}
  else{st.vx+=ax*1600*dt*pes;st.vy+=ay*1600*dt*pes;st.vx*=Math.pow(.02,dt);st.vy*=Math.pow(.02,dt)}
  const maxX=correndo?W*0.7:W*0.6;
  st.x=Math.max(30,Math.min(maxX,st.x+st.vx*dt));st.y=Math.max(30,Math.min(H-30,st.y+st.vy*dt));

  st.sinal-=(correndo?5+st.n*1.2:3.2)*dt*(st.online?.8:1);
  if(st.sinal<=0){st.sinal=0;perdeu('sinal');return}
  if(st.inv>0)st.inv-=dt;
  if(R()<.8)st.parts.push({x:st.x-22,y:st.y+(R()-.5)*10,vx:-st.vel*.3-R()*60,vy:(R()-.5)*30,v:.6,c:'#5cf0a8',s:3+R()*3});

  if(st.filaAvisos&&st.filaAvisos.length&&st.banner<=.2){st.bannerTxt=st.filaAvisos.shift();st.banner=2.2}
  if(correndo){
    st.dist+=st.vel*dt;
    if(st.fila){while(st.fila.length&&st.dist+W*0.9>=st.fila[0].d){const l=st.fila.shift();st.itens.push({k:'letra',x:W+30+R()*60,y:60+R()*(H-120),r:20,t:R()*6,i:l.i,ch:l.ch})}}
    if(st.mimo==='tubarao'&&st.dist<st.distMax*.95){st.tubT=(st.tubT||1.5)-dt;if(st.tubT<=0){st.tubT=1.6+R();st.obs.push({k:'peixe',tub:true,x:W+60,y:60+R()*(H-120),r:22,vx:-200-R()*80})}}
    if(st.fogoSempre){st.fogo-=dt;if(st.fogo<=0){st.meus.push({x:st.x+24,y:st.y,vx:620,fogo:1});st.fogo=.32}}
    if(st.dist<st.distMax*0.95){st.spawn-=dt;if(st.spawn<=0){gerarObstaculo();st.spawn=Math.max(.5,1.25-st.dist/st.distMax*.5-st.n*.08)*(.8+R()*.4)*(st.online?1.15:1)}}
    st.spawnItem-=dt;if(st.spawnItem<=0){gerarItem();st.spawnItem=1.5+R()*1.1}
    if(st.dist>=st.distMax&&st.obs.length===0){if(st.semChefe){st.estado='chegando';st.fimT=0;st.tiros=[];st.avisos=[]}else iniciaChefe()}
  }else{
    st.spawnItem-=dt;if(st.spawnItem<=0){gerarItem();st.spawnItem=2.2+R()*1.2}
    atualizaChefe(dt);
    if(!st.boss.entrando){st.fogo-=dt;if(st.fogo<=0){st.meus.push({x:st.x+24,y:st.y,vx:620,fogo:st.fogoSempre?1:0});st.fogo=.2}}
    if(st.online)atualizaPad();
  }

  const v=st.vel*(correndo?1:.45);
  for(const o of st.obs){
    o.x-=(o.vel||st.vel)*dt;
    if(o.k==='virus'){o.fase+=dt*2.4;o.y=o.base+Math.sin(o.fase)*o.amp}
    if(o.k==='spam'){o.y+=o.vy*dt;if(o.y<30||o.y>H-30)o.vy*=-1}
    if(o.k==='peixe')o.x+=o.vx*dt;
    if(o.k==='parede'&&o.mov){o.gy+=o.mov*dt;if(o.gy<30||o.gy+o.gap>H-30)o.mov*=-1}
  }
  for(const i of st.itens){i.x-=v*dt;i.t+=dt}
  for(const s of st.tiros){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vida-=dt}
  for(const m of st.meus)m.x+=m.vx*dt;
  for(const a of st.avisos){a.t-=dt;if(a.t<=0)a.ativo+=dt}
  st.obs=st.obs.filter(o=>o.x>-80);st.itens=st.itens.filter(i=>i.x>-40&&!i.pego);
  st.tiros=st.tiros.filter(s=>s.vida>0&&s.x>-30&&s.x<W+30&&s.y>-30&&s.y<H+30);
  st.meus=st.meus.filter(m=>m.x<W+20&&!m.morto);
  st.avisos=st.avisos.filter(a=>a.ativo<.35);

  const pr=15;let bate=false;
  for(const i of st.itens)if(Math.hypot(i.x-st.x,i.y-st.y)<i.r+pr){i.pego=true;
    if(i.k==='letra'){J.c=J.c.filter(x=>x!==i.i);st.letrasPegas++;explodir(i.x,i.y,'#ffd24d',10);st.pegouT={ch:i.ch,v:.7}}
    else{st.pegos++;st.sinal=Math.min(100,st.sinal+22);explodir(i.x,i.y,'#4fc3ff',14)}}
  if(st.fogoSempre&&correndo){for(const m of st.meus)for(const o of st.obs)if(o.k!=='parede'&&!o.morto&&Math.hypot(o.x-m.x,o.y-m.y)<o.r+10){o.morto=m.morto=true;explodir(o.x,o.y,'#ff9a3d',12)}
    st.obs=st.obs.filter(o=>!o.morto);st.meus=st.meus.filter(m=>!m.morto)}
  for(const o of st.obs){
    if(o.k==='parede'){if(st.x+pr>o.x-o.w/2&&st.x-pr<o.x+o.w/2&&(st.y-pr<o.gy||st.y+pr>o.gy+o.gap))bate=true}
    else if(Math.hypot(o.x-st.x,o.y-st.y)<o.r+pr-4)bate=true;
  }
  for(const s of st.tiros)if(Math.hypot(s.x-st.x,s.y-st.y)<s.r+pr-5){bate=true;s.vida=0}
  for(const a of st.avisos)if(a.t<=0&&a.k==='raio'&&Math.abs(st.x-a.x)<a.w/2+pr-4)bate=true;
  const b=st.boss;
  if(b&&!b.entrando){
    if(Math.hypot(b.x-st.x,b.y-st.y)<52+pr)bate=true;
    for(const m of st.meus)if(Math.abs(m.x-b.x)<(b.escudo?72:50)&&Math.abs(m.y-b.y)<(b.escudo?72:56)){
      m.morto=true;
      if(b.escudo){explodir(m.x,m.y,'#9fd8ff',3);continue}
      b.hp-=m.fogo?2:1;b.flash=.08;explodir(m.x,m.y,m.fogo?'#ff9a3d':b.cor,4);
      if(b.hp<=0){derrotaChefe();return}
    }
  }
  if(bate&&st.inv<=0&&st.escudos>0){st.escudos--;st.inv=1.2;explodir(st.x,st.y,'#9fd8ff',20);st.banner=1;st.bannerTxt='ESCUDO QUEBROU!';bate=false}
  if(bate&&st.inv<=0){
    st.vidas--;st.inv=1.4;st.shake=.35;st.sinal=Math.max(0,st.sinal-10);explodir(st.x,st.y,'#ff5577',22);
    if(modo!=='treino'&&J){corromper(perdaPorDano());st.letraT=1.2}
    if(st.vidas<=0){perdeu('dano');return}
  }
}
function derrotaChefe(){
  const b=st.boss;
  for(let i=0;i<5;i++)explodir(b.x+(R()-.5)*60,b.y+(R()-.5)*60,i%2?b.cor:'#fff',24);
  st.shake=.6;st.tiros=[];st.obs=[];st.avisos=[];st.boss=null;st.meus=[];
  st.banner=2;st.bannerTxt=b.nome.toUpperCase()+' DERROTADO!';
  st.fimT=0;st.estado=st.ultima?'chegando':'vitoria';
  st.bossNome=b.nome;st.bossEmoji=b.emoji;
  if(st.online)atualizaPad();
}
function faseVencida(){
  st.estado='fim';
  if(modo==='treino'){
    if(st.n+1>liberado){liberado=Math.min(FASES.length-1,st.n+1);ls.set('entrega_lib',liberado)}
    return telaTreinoFim(true);
  }
  if(modo==='chat')return entregaConcluida();
  J.pts+=Math.round(300+st.vidas*150+st.pegos*30);
  J.pos++;J.vidas=Math.min(3,st.vidas+1);J.sinal=Math.max(70,st.sinal);
  if(modo==='online'){
    mostraCtrl();envia({t:'fim',ok:true,J,chefe:st.bossEmoji});
    if(J.pos>=ROTAS[J.rota].length)return telaOnlineChegou();
    return telaOnlineFaseOk(st.bossEmoji);
  }
  if(J.pos>=ROTAS[J.rota].length)return telaChegou();
  if(J.pos===CORTE)return telaPassar();

}
function perdeu(motivo){

  if(modo==='online'){mostraCtrl();envia({t:'fim',ok:false,motivo,J});setTimeout(()=>telaOnlinePerdeu(motivo),500);return}
  setTimeout(()=>modo==='jornada'?telaPerdeu(motivo):telaTreinoFim(false,motivo),500);

function atualizaParts(dt){for(const q of st.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.v-=dt}st.parts=st.parts.filter(q=>q.v>0)}
function explodir(x,y,c,n){for(let i=0;i<n;i++){const a=R()*7,s=80+R()*220;st.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,v:.5+R()*.4,c,s:3+R()*4})}}

    obs:st.obs.map(o=>o.k==='parede'?[0,r0(o.x),r0(o.gy),r0(o.gap),o.w]:[o.k==='virus'?1:o.k==='spam'?2:3,r0(o.x),r0(o.y),r0(o.r)]),

    boss:d.boss});

const wrap=(v,m)=>((v%m)+m)%m;
function estadoVisivel(){return st.estado==='espectador'?(st.remEstado||'corrida'):st.estado}
function fundo(){
  const f=st.f,off=st.scroll,ev=estadoVisivel();

  if(n===0){ctx.globalAlpha=.12;ctx.strokeStyle='#fff';ctx.lineWidth=3;
    for(let i=0;i<6;i++){const x=wrap(i*260-off*.2,W+260)-130;for(let k=1;k<4;k++){ctx.beginPath();ctx.arc(x,H*.75,k*30,-2.4,-.74);ctx.stroke()}}
    ctx.globalAlpha=1}
  if(n===1){for(let i=0;i<20;i++){ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(wrap(i*97-off*.05,W),(i*53)%(H*.4),2,2)}
    for(let i=0;i<5;i++){const x=wrap(i*340-off*.35,W+340)-170;
      ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-30,H);ctx.lineTo(x,H*.45);ctx.lineTo(x+30,H);ctx.moveTo(x-20,H*.75);ctx.lineTo(x+20,H*.75);ctx.stroke();
      ctx.fillStyle='rgba(255,90,90,'+(.4+.4*Math.sin(st.t*4+i))+')';ctx.beginPath();ctx.arc(x,H*.45,5,0,7);ctx.fill()}}
  if(n===2){ctx.fillStyle='rgba(255,255,255,.08)';
    for(let i=0;i<25;i++){const x=wrap(i*83-off*.3,W),y=H-((st.t*40+i*61)%H);ctx.beginPath();ctx.arc(x,y,2+(i%3),0,7);ctx.fill()}
    ctx.strokeStyle='#f2a93b';ctx.lineWidth=10;ctx.beginPath();for(let x=0;x<=W;x+=20)ctx.lineTo(x,H-40+Math.sin((x+off)*.01)*8);ctx.stroke();
    ctx.strokeStyle='#ffd27a';ctx.lineWidth=2;ctx.stroke()}
  if(n===3){for(let i=0;i<8;i++){const x=wrap(i*170-off*.4,W+170)-85;
      ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(x-40,H*.2,80,H*.8);
      for(let j=0;j<10;j++){ctx.fillStyle=(Math.sin(st.t*6+i*3+j*7)>.3)?'rgba(92,240,168,.6)':'rgba(92,240,168,.12)';ctx.fillRect(x-30,H*.24+j*28,6,4)}}}
  if(n===4){for(let i=0;i<12;i++){const x=wrap(i*120-off*.3,W+120)-60,h=80+(i*37)%140;
      ctx.fillStyle='rgba(30,10,30,.5)';ctx.fillRect(x,H-h,90,h);
      ctx.fillStyle='rgba(255,220,120,.5)';for(let j=0;j<h/30-1;j++){ctx.fillRect(x+15,H-h+12+j*28,10,10);ctx.fillRect(x+60,H-h+12+j*28,10,10)}}}
  if(ev==='chefe'){ctx.fillStyle='rgba(255,0,40,'+(.05+.04*Math.sin(st.t*3))+')';ctx.fillRect(0,0,W,H)}
  if(st.primeira&&ev==='corrida'){const sx=W*0.08-st.dist*0.8;if(sx>-120)celular(sx,H/2,dados.de||'Você','#5cf0a8')}
  if(ev==='chegando'){const k=Math.min(1,st.fimT/1.2);celular(W+80-(W*0.2+80)*k,H/2,dados.para||'Destino','#ff9ad5')}
}
function celular(x,y,nome,cor){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#111';rr(-55,-100,110,200,18);ctx.fill();
  ctx.fillStyle='#e9f3ff';rr(-48,-86,96,172,10);ctx.fill();
  ctx.fillStyle=cor;rr(-48,-86,96,26,[10,10,0,0]);ctx.fill();
  ctx.fillStyle='#08321d';ctx.font='700 14px "Baloo 2"';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(nome,0,-68);
  ctx.fillStyle='#ccd';for(let i=0;i<3;i++){rr(-40+(i%2)*20,-50+i*34,56,22,8);ctx.fill()}
  ctx.restore();
}
function mensagem(){
  if(st.escudos>0){ctx.strokeStyle='rgba(159,216,255,'+(.55+.3*Math.sin(st.t*7))+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(st.x,st.y,36,0,7);ctx.stroke()}
  if(st.pegouT&&st.pegouT.v>0){ctx.globalAlpha=Math.min(1,st.pegouT.v*2);ctx.font='800 22px "Baloo 2", serif';ctx.fillStyle='#ffd24d';ctx.textAlign='center';ctx.fillText('+'+st.pegouT.ch,st.x,st.y-34-(.7-st.pegouT.v)*30);ctx.globalAlpha=1;st.pegouT.v-=1/60}
  if(st.inv>0&&Math.floor(st.t*14)%2)return;
  const rindo=st.efeitos&&st.efeitos.includes('kkk');
  ctx.save();ctx.translate(st.x,st.y);ctx.rotate(Math.max(-.35,Math.min(.35,(st.vy||0)*.0012))+(rindo?Math.sin(st.t*22)*.12:0));
  ctx.shadowColor='#5cf0a8';ctx.shadowBlur=18;ctx.fillStyle='#fff';rr(-24,-16,48,32,6);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='#c9d4e8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-24,-14);ctx.lineTo(0,4);ctx.lineTo(24,-14);ctx.stroke();
  ctx.fillStyle='#1b2550';ctx.beginPath();ctx.arc(-8,6,2.6,0,7);ctx.arc(8,6,2.6,0,7);ctx.fill();
  ctx.strokeStyle='#1b2550';ctx.lineWidth=2;ctx.beginPath();
  if(rindo){ctx.fillStyle='#1b2550';ctx.beginPath();ctx.arc(0,9,6,0,Math.PI);ctx.fill()}
  else if(estadoVisivel()==='chefe'){ctx.moveTo(-5,11);ctx.lineTo(5,11)}else ctx.arc(0,9,4,.2,2.9);ctx.stroke();
  ctx.restore();
  if(st.letraT>0){ctx.globalAlpha=Math.min(1,st.letraT);ctx.font='800 16px "Baloo 2"';ctx.fillStyle='#ff6b8a';ctx.textAlign='center';ctx.fillText('letras perdidas!',st.x,st.y-30-(1.2-st.letraT)*20);ctx.globalAlpha=1;st.letraT-=1/60}
}
function desenhaObs(){
  for(const o of st.obs){
    if(o.k==='parede'){
      for(const [y0,y1] of [[0,o.gy],[o.gy+o.gap,H]]){
        const g=ctx.createLinearGradient(o.x-o.w/2,0,o.x+o.w/2,0);g.addColorStop(0,'#ff3d2e');g.addColorStop(.5,'#ffb13b');g.addColorStop(1,'#ff3d2e');
        ctx.fillStyle=g;ctx.fillRect(o.x-o.w/2,y0,o.w,y1-y0);
        ctx.fillStyle='rgba(120,20,10,.5)';for(let yy=y0;yy<y1;yy+=22)ctx.fillRect(o.x-o.w/2,yy,o.w,3);
      }
      ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
      ctx.fillText('🔥',o.x,o.gy-6+Math.sin(st.t*10)*2);ctx.fillText('🔥',o.x,o.gy+o.gap+24+Math.sin(st.t*10+1)*2);
    }else{
      ctx.save();ctx.translate(o.x,o.y);
      if(o.k==='virus')ctx.rotate(st.t*2);
      if(o.k==='spam'){ctx.fillStyle='rgba(255,60,90,.25)';ctx.beginPath();ctx.arc(0,0,o.r+6,0,7);ctx.fill()}
      ctx.font=(o.r*2)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      if(o.k==='peixe')ctx.scale(-1,1);
      ctx.fillText(o.tub?'🦈':{virus:'🦠',spam:'📧',peixe:'🐟'}[o.k],0,2);
      if(o.k==='spam'){ctx.font='800 10px "Baloo 2"';ctx.fillStyle='#ff4d6d';ctx.fillText('SPAM',0,o.r+10)}
      ctx.restore();
    }
  }
  for(const i of st.itens){
    if(i.k==='letra'){ctx.save();ctx.translate(i.x,i.y+Math.sin(st.t*3+i.t)*5);ctx.rotate(Math.sin(st.t*2+i.t)*.15);
      ctx.shadowColor='#ffd24d';ctx.shadowBlur=14;ctx.fillStyle='#fff7d6';rr(-17,-19,34,38,8);ctx.fill();ctx.shadowBlur=0;
      ctx.strokeStyle='#ffb13b';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#3a2a00';ctx.font='800 24px "Baloo 2", serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(i.ch,0,2);ctx.restore();continue}
    ctx.save();ctx.translate(i.x,i.y+Math.sin(st.t*4+i.x*.01)*4);
    ctx.fillStyle='rgba(79,195,255,.25)';ctx.beginPath();ctx.arc(0,0,i.r+4,0,7);ctx.fill();
    ctx.strokeStyle='#4fc3ff';ctx.lineWidth=3;ctx.lineCap='round';
    for(let k=1;k<=3;k++){ctx.beginPath();ctx.arc(0,8,k*5.5,-2.4,-.74);ctx.stroke()}
    ctx.fillStyle='#4fc3ff';ctx.beginPath();ctx.arc(0,8,2.5,0,7);ctx.fill();ctx.restore();
  }
}
function desenhaAvisos(){
  for(const a of st.avisos){
    const ativo=a.t<=0,pisca=Math.floor(st.t*12)%2;
    if(a.k==='raio'){
      if(ativo){ctx.fillStyle='rgba(255,240,120,.9)';ctx.fillRect(a.x-a.w/2,0,a.w,H);
        ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();let y=0,x=a.x;ctx.moveTo(x,0);while(y<H){y+=30;x=a.x+(R()-.5)*a.w*.8;ctx.lineTo(x,y)}ctx.stroke()}
      else{ctx.fillStyle=pisca?'rgba(255,230,80,.28)':'rgba(255,230,80,.12)';ctx.fillRect(a.x-a.w/2,0,a.w,H);
        ctx.font='26px serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText('⚡',a.x,60)}
    }
    if(a.k==='faixa'&&!ativo){ctx.fillStyle=pisca?'rgba(90,170,230,.3)':'rgba(90,170,230,.12)';ctx.fillRect(0,a.y-a.h/2,W,a.h);
      ctx.font='800 18px "Baloo 2"';ctx.fillStyle='#bfe6ff';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText('◀◀ CUIDADO',W*0.5,a.y+6)}
  }
}
function desenhaChefe(alpha=1){
  const b=st.boss;if(!b)return;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(b.x,b.y);
  const pulso=1+Math.sin(st.t*5)*.04;ctx.scale(pulso,pulso);
  ctx.shadowColor=b.cor;ctx.shadowBlur=30;
  ctx.fillStyle=b.flash>0?'#fff':'rgba(20,20,40,.85)';ctx.beginPath();ctx.arc(0,0,58,0,7);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle=b.cor;ctx.lineWidth=5;ctx.stroke();
  ctx.font='64px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  if(st.n===2)ctx.scale(-1,1);
  ctx.fillText(b.emoji,0,4);ctx.restore();
  ctx.save();ctx.globalAlpha=alpha;
  if(b.escudo&&!b.entrando){ // bolha de escudo
    ctx.strokeStyle='rgba(159,216,255,'+(.6+.3*Math.sin(st.t*8))+')';ctx.lineWidth=6;ctx.beginPath();ctx.arc(b.x,b.y,74,0,7);ctx.stroke();
    ctx.fillStyle='rgba(159,216,255,.12)';ctx.fill();
  }
  ctx.fillStyle='#ff2e4d';ctx.beginPath();ctx.arc(b.x-18,b.y-44,5,0,7);ctx.arc(b.x+18,b.y-44,5,0,7);ctx.fill();
  if(b.falaT>0&&!b.entrando){
    ctx.font='700 15px "Baloo 2"';const tw=ctx.measureText(b.fala).width+20;
    const bx=Math.max(10,b.x-tw-40),by=b.y-90;
    ctx.fillStyle='rgba(255,255,255,.95)';rr(bx,by,tw,30,12);ctx.fill();
    ctx.fillStyle='#1b2550';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText(b.fala,bx+10,by+20);
  }
  ctx.restore();
}
function desenhaTiros(alpha=1){
  ctx.save();ctx.globalAlpha=alpha;ctx.textAlign='center';ctx.textBaseline='middle';
  for(const s of st.tiros){ctx.fillStyle=s.cor;ctx.shadowColor=s.cor;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}
  ctx.shadowBlur=0;ctx.font='800 18px "Baloo 2"';ctx.fillStyle='#5cf0a8';
  for(const m of st.meus)ctx.fillText('✓',m.x,m.y);
  ctx.restore();
}
// escuridão do piloto
function escuridao(){
  const ev=estadoVisivel();
  let raio=ev==='chefe'?135:100;if(st.luz>0)raio+=Math.min(1,st.luz)*520;
  if(ev==='vitoria'||ev==='chegando')raio=900;
  const g=ctx.createRadialGradient(st.x,st.y,raio*.55,st.x,st.y,raio);
  g.addColorStop(0,'rgba(2,3,8,0)');g.addColorStop(1,'rgba(2,3,8,.97)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // pistas fracas: chefe e tiros
  if(st.boss)desenhaChefe(.3);
  desenhaTiros(.14);
  // pings do operador
  for(const p of st.pings){
    const a=Math.min(1,p.v);ctx.strokeStyle='rgba(255,210,77,'+a+')';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(p.x,p.y,18+(1.6-p.v)*30,0,7);ctx.stroke();
    ctx.fillStyle='rgba(255,210,77,'+a+')';ctx.font='800 22px "Baloo 2"';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',p.x,p.y);
    // seta a partir da mensagem
    const ang=Math.atan2(p.y-st.y,p.x-st.x);ctx.save();ctx.translate(st.x+Math.cos(ang)*46,st.y+Math.sin(ang)*46);ctx.rotate(ang);
    ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-6,-8);ctx.lineTo(-6,8);ctx.closePath();ctx.fill();ctx.restore();
  }
}
// visão do operador: radar + código do escudo
function camadaOperador(){
  ctx.strokeStyle='rgba(92,240,168,.08)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  // área que o piloto enxerga
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.setLineDash([6,6]);ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(st.x,st.y,estadoVisivel()==='chefe'?100:75,0,7);ctx.stroke();ctx.setLineDash([]);
  for(const p of st.pings){ctx.strokeStyle='rgba(255,210,77,'+Math.min(1,p.v)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,18+(1-p.v)*20,0,7);ctx.stroke()}
  const b=st.boss;
  if(b&&b.escudo&&!b.entrando&&b.codigo){
    const n=b.codigo.length,w=n*52+30,x0=(W-w)/2,y0=H-112;
    ctx.fillStyle='rgba(0,0,0,.7)';rr(x0,y0,w,58,14);ctx.fill();
    ctx.font='700 12px "Baloo 2"';ctx.fillStyle='#bfe6ff';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText('DITE O CÓDIGO DO ESCUDO',W/2,y0-6);
    b.codigo.forEach((c,i)=>{const cx=x0+30+i*52,cy=y0+29;
      ctx.fillStyle=CORES[c];ctx.globalAlpha=i<b.prog?.25:1;ctx.beginPath();ctx.arc(cx,cy,19,0,7);ctx.fill();ctx.globalAlpha=1;
      if(i===b.prog){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke()}
      ctx.fillStyle='#000';ctx.font='800 9px "Baloo 2"';ctx.textBaseline='middle';ctx.fillText(NOMES_COR[c].slice(0,3),cx,cy)});
  }else if(b&&!b.escudo&&b.escudoT>0){ctx.font='800 16px "Baloo 2"';ctx.fillStyle='#5cf0a8';ctx.textAlign='center';ctx.fillText('ESCUDO DESLIGADO: '+b.escudoT.toFixed(0)+'s',W/2,H-70)}
  if(st.meuCmd){ctx.globalAlpha=Math.min(1,st.meuCmd.v*2);ctx.font='800 20px "Baloo 2"';ctx.fillStyle='#ffd24d';ctx.textAlign='center';ctx.fillText('enviado: '+st.meuCmd.txt,W/2,H*.42);ctx.globalAlpha=1}
  if(st.luzCd>0){ctx.font='700 12px "Baloo 2"';ctx.fillStyle='#ffd24d';ctx.textAlign='right';ctx.fillText('💡 '+Math.ceil(st.luzCd)+'s',W-14,H-66)}
  if(!st.snap){ctx.font='800 20px "Baloo 2"';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('Conectando ao radar…',W/2,H/2)}
}
function hud(){
  const bw=Math.min(W-40,520),bx=(W-bw)/2,by=16,ev=estadoVisivel();
  ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(0,0,0,.35)';rr(bx-10,by-6,bw+20,40,14);ctx.fill();
  if(ev==='chefe'&&st.boss){
    const b=st.boss,p=b.hp/b.hpMax;
    ctx.fillStyle='rgba(255,255,255,.15)';rr(bx+36,by+10,bw-50,10,5);ctx.fill();
    ctx.fillStyle=b.escudo&&st.online?'#9fd8ff':b.cor;rr(bx+36,by+10,(bw-50)*p,10,5);ctx.fill();
    ctx.font='18px serif';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText(b.emoji,bx-2,by+22);
  }else{
    const p=Math.min(1,st.dist/st.distMax);
    ctx.fillStyle='rgba(255,255,255,.15)';rr(bx+30,by+10,bw-60,8,4);ctx.fill();
    ctx.fillStyle='#5cf0a8';rr(bx+30,by+10,(bw-60)*p,8,4);ctx.fill();
    ctx.font='700 13px "Baloo 2"';ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText(modo==='chat'?'💬':J&&modo!=='treino'?(J.pos+1)+'/5':'F'+(st.n+1),bx-4,by+20);
    ctx.font='18px serif';ctx.textAlign='right';ctx.fillText(st.semChefe?'📱':st.f.chefe.emoji,bx+bw+6,by+22);
    ctx.textAlign='center';ctx.fillText('✉️',bx+30+(bw-60)*p,by+12);
  }
  const sy=by+46;ctx.textAlign='left';ctx.font='700 13px "Baloo 2"';
  ctx.fillStyle='rgba(0,0,0,.35)';rr(14,sy,150,28,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillText('SINAL',22,sy+19);
  const cor=st.sinal>50?'#4fc3ff':st.sinal>25?'#ffc14d':'#ff4d6d';
  for(let i=0;i<5;i++){ctx.fillStyle=st.sinal>i*20?cor:'rgba(255,255,255,.15)';ctx.fillRect(72+i*16,sy+20-(i+1)*3.2,11,(i+1)*3.2+2)}
  ctx.fillStyle='rgba(0,0,0,.35)';rr(W-124,sy,110,28,10);ctx.fill();
  ctx.textAlign='right';ctx.font='16px serif';ctx.fillStyle='#fff';
  const vv=Math.max(0,st.vidas);ctx.fillText('✉️'.repeat(vv)+'·'.repeat(Math.max(0,3-vv)),W-22,sy+20);
  if(modo==='online'){ctx.font='800 12px "Baloo 2"';ctx.textAlign='left';ctx.fillStyle=net.souPiloto?'#5cf0a8':'#ffd24d';
    ctx.fillText(net.souPiloto?'🕹️ PILOTO':'📡 OPERADOR · toque pra marcar perigo',14,sy+46)}
  // texto da mensagem (só quem escreveu vê no online)
  const verTexto=J&&(modo==='jornada'||modo==='chat'||(modo==='online'&&net.role==='host'));
  if(verTexto&&!(modo==='online'&&!net.souPiloto)){
    const txt=textoEstragado();ctx.font='700 14px "Baloo 2"';
    const mw=Math.min(W*0.6,ctx.measureText(txt).width+24);
    ctx.fillStyle='rgba(0,0,0,.45)';rr(14,H-44,mw,30,10);ctx.fill();
    ctx.save();ctx.beginPath();ctx.rect(14,H-44,mw,30);ctx.clip();
    ctx.textAlign='left';ctx.fillStyle='#e9f3ff';ctx.fillText(txt,26,H-24);ctx.restore();
  }
  if(st.banner>0){ctx.globalAlpha=Math.min(1,st.banner);ctx.textAlign='center';ctx.font='800 '+(W<500?20:28)+'px "Baloo 2"';
    ctx.fillStyle='#000';ctx.fillText(st.bannerTxt,W/2+2,H*.3+2);ctx.fillStyle='#fff';ctx.fillText(st.bannerTxt,W/2,H*.3);ctx.globalAlpha=1}
  if(st.cmd){ctx.globalAlpha=Math.min(1,st.cmd.v*2);ctx.textAlign='center';ctx.font='800 40px "Baloo 2"';
    ctx.fillStyle='#000';ctx.fillText(st.cmd.txt,W/2+3,H*.45+3);ctx.fillStyle='#ffd24d';ctx.fillText(st.cmd.txt,W/2,H*.45);ctx.globalAlpha=1}
  if(st.sinal<25&&Math.floor(st.t*4)%2&&st.estado!=='fim'){ctx.textAlign='center';ctx.font='800 18px "Baloo 2"';ctx.fillStyle='#ff4d6d';ctx.fillText('SINAL FRACO! PEGUE 📶',W/2,H-60)}
}
function desenhaParts(){for(const q of st.parts){ctx.globalAlpha=Math.max(0,q.v*1.5);ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,q.s,q.s)}ctx.globalAlpha=1}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#05070f';ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*OY);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  if(st.shake>0)ctx.translate((R()-.5)*12,(R()-.5)*12);
  fundo();desenhaAvisos();desenhaObs();desenhaChefe();desenhaTiros();desenhaParts();
  if(st.estado!=='fim'&&st.estado!=='parado')mensagem();
  if(modo==='online'&&st.estado!=='fim'){if(net.souPiloto)escuridao();else camadaOperador()}
  if(modo==='chat'&&st.mimo==='neblina'&&st.estado!=='fim'&&st.estado!=='chegando'){const g=ctx.createRadialGradient(st.x,st.y,90,st.x,st.y,200);
    g.addColorStop(0,'rgba(200,210,230,0)');g.addColorStop(1,'rgba(190,200,220,.93)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  ctx.restore();
  if(st.estado!=='parado')hud();
  // aviso de celular em pé no online
  $('aviso').classList.toggle('oculta',!(modo==='online'&&innerHeight>innerWidth&&st.estado!=='fim'));
  if(modo==='online')$('aviso').textContent='📱 Deite o celular pra ver melhor';
}

// ================= LOOP =================
let last=performance.now();
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
if(/^#sala-[A-Z]{4}$/i.test(location.hash))aba='online';
if(/^#c-[a-z0-9]{10}$/.test(location.hash))aba='conversas';
novo(0);st.estado='parado';telaInicio();requestAnimationFrame(loop);
})();
</script>
